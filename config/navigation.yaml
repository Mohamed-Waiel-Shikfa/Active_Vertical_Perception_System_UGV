map_server:
  ros__parameters:
    use_sim_time: true
    frame_id: greenhouse
    topic_name: map
    yaml_filename: "@MAP@"
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.1
      allow_unknown: false
      max_iterations: 100000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 100
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    enable_stamped_cmd_vel: true
    odom_topic: /greenhouse/nav/odom
    odom_duration: 0.1
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.0
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 30.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # Not stateful: the gateway finishes goals itself (dock / final turn), and a latched
      # checker carried "XY reached" into the next goal after the gateway cancelled one.
      # The gateway requires actual XY <= 0.10 m and yaw <= 5 deg either way.
      xy_goal_tolerance: 0.075
      yaw_goal_tolerance: 0.07
      stateful: false
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # Maxima; each Go narrows desired_linear_vel / rotate_to_heading_angular_vel to the panel.
      desired_linear_vel: 2.0
      rotate_to_heading_angular_vel: 1.2
      max_angular_accel: 1.5
      use_velocity_scaled_lookahead_dist: true
      lookahead_time: 1.5
      # Short enough at low speed to follow the 0.95 m row-end hairpin: with 1.0 m the robot ran
      # 0.25 m inside it and stopped on a collision. The gateway also slows curves so 1.5 s of
      # speed stays within 0.7 R; 1.5 s of travel still spans the base's 0.5 s yaw lag.
      lookahead_dist: 0.6
      min_lookahead_dist: 0.6
      max_lookahead_dist: 3.0
      transform_tolerance: 0.2
      min_approach_linear_velocity: 0.1
      approach_velocity_scaling_dist: 1.5
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 2.0
      regulated_linear_scaling_min_speed: 0.25
      use_cost_regulated_linear_velocity_scaling: false
      use_fixed_curvature_lookahead: false
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.5
      allow_reversing: false
      use_cancel_deceleration: false
      max_robot_pose_search_dist: 4.0
      interpolate_curvature_after_goal: false
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: greenhouse
    robot_base_frame: "@NAV_BASE@"
    odom_topic: /greenhouse/nav/odom
    bt_loop_duration: 100
    default_server_timeout: 2000
    wait_for_service_timeout: 5000
    action_server_result_timeout: 900.0
    navigators: [navigate_to_pose]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    default_nav_to_pose_bt_xml: /opt/greenhouse/config/navigate.xml
    error_code_names: [compute_path_error_code, follow_path_error_code]
global_costmap/global_costmap:
  ros__parameters:
    use_sim_time: true
    global_frame: greenhouse
    robot_base_frame: "@NAV_BASE@"
    update_frequency: 2.0
    publish_frequency: 1.0
    resolution: 0.05
    robot_radius: 0.368
    footprint_padding: 0.0
    transform_tolerance: 0.3
    track_unknown_space: true
    plugins: [static_layer, inflation_layer]
    static_layer:
      plugin: "nav2_costmap_2d::StaticLayer"
      map_topic: "@MAP_TOPIC@"
      map_subscribe_transient_local: true
      subscribe_to_updates: true
    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      # Centres paths in the aisles and keeps ~0.23 m extra clearance around row ends.
      # Maximum: prepare_navigation shrinks it so every aisle centreline stays cost-free;
      # a costed centreline made Smac detour down a wider, cost-free outer aisle.
      inflation_radius: 0.6
      cost_scaling_factor: 4.0
    always_send_full_costmap: true
local_costmap/local_costmap:
  ros__parameters:
    use_sim_time: true
    global_frame: "@NAV_ODOM@"
    robot_base_frame: "@NAV_BASE@"
    update_frequency: 5.0
    publish_frequency: 2.0
    rolling_window: true
    width: 8
    height: 8
    # Finer than the 0.05 m map: RPP's collision projection steps one cell, and the footprint
    # padding covering the gap between steps scales with it (prepare_navigation derives it).
    # 0.05 m with the 0.6 m lookahead needed 0.040 m and left an in-place spin 0.176 m of
    # aisle slack; 0.025 m needs 0.020 m and leaves 0.204 m (0.184 m before either change).
    resolution: 0.025
    footprint: "[[0.279,0.24],[0.279,-0.24],[-0.279,-0.24],[-0.279,0.24]]"
    footprint_padding: 0.02
    transform_tolerance: 0.3
    plugins: [static_layer, inflation_layer]
    static_layer:
      plugin: "nav2_costmap_2d::StaticLayer"
      map_topic: "@MAP_TOPIC@"
      map_subscribe_transient_local: true
      subscribe_to_updates: true
    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      inflation_radius: 0.6
      cost_scaling_factor: 5.0
    always_send_full_costmap: true
